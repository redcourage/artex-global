padding:0 3px;border:0;background:transparent;line-height:1.3;color:var(--muted-foreground)}.grip:active{cursor:grabbing}.panetitle{font-size:12px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.pinen{font-size:11px;color:var(--muted-foreground);margin-left:auto}.panemeta{padding:7px 12px;display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted-foreground);border-bottom:1px solid var(--border)}.transcript{flex:1;min-height:0;overflow:auto;padding:17px 16px;font-size:var(--reading,14px);line-height:1.8;overflow-wrap:anywhere}.entry{margin:0 0 20px}.entryhead{display:flex;align-items:center;gap:7px;margin-bottom:8px;color:var(--muted-foreground);font-size:11px}.entryhead time{margin-left:auto;font-variant-numeric:tabular-nums}.marker{color:var(--primary);font-family:GeistMono}.thinking{color:var(--muted-foreground);margin:10px 0}.thinking summary{cursor:pointer;font-size:12px}.thinking p{margin:6px 0 0 20px}.tool{margin:12px 0}.tool summary{padding:4px 0;font-size:12px;cursor:pointer;color:var(--primary)}.tool .result{margin:4px 0 0 20px;padding:10px 11px;border-radius:6px;background:var(--muted);font-size:12px;white-space:pre-wrap}.tool .result span{color:var(--demo-success)}.inline{background:var(--muted);color:var(--foreground);padding:1px 4px;border-radius:3px;font-size:.9em}.finding{margin:16px 0}.finding strong{font-size:13px}.finding .severity{color:var(--demo-warning);font-size:11px;font-weight:600;letter-spacing:.5px}.finding p{font-size:13px;margin:6px 0}.foot{display:flex;justify-content:space-between;padding:7px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-foreground)}.handle{position:absolute;z-index:2;touch-action:none}.handle:hover,.handle:focus-visible{background:var(--ring);opacity:.6;border-radius:4px}.drop{pointer-events:none;position:absolute;padding:5px;z-index:4}.drop>div{height:100%;border:2px solid var(--primary);background:color-mix(in srgb,var(--primary) 20%,tr <body>
<header class="lab"><div class="brandline"><span class="wordmark">ARTEX</span><span class="division"></span><h1 class="labtitle">Theme Lab</h1><span class="tag">시연 데이터</span><span class="spacer"></span><button id="compareGraphiteButton" aria-pressed="false">Light / Dark Contrast 비교</button><button id="compareButton" aria-pressed="false">4개 테마 비교</button></div><div id="choices" class="choices"></div></header>

<main class="app" id="app"><div class="appbar"><span class="wordmark" style="font-size:16px">A</span><span class="muted">Tasks /</span><strong>내부 서비스 보안 검증</strong><span class="tag mono">DEMO–024</span><span class="spacer"></span><span class="status"><i></i> 에이전트 작업 중</span><button id="exitCapture" style="font-size:11px;padding:3px 8px" hidden>테마 설정</button></div><div class="layoutbar"><button id="toggleList" aria-pressed="true">세션 목록</button><span class="muted">손잡이 드래그 · 가장자리 분할 · 가운데 교환 · Esc 취소</span><span class="spacer"></span><div id="layouts" style="display:flex;gap:3px"></div><details class="keyboard"><summary>패널 이동</summary><div class="menu"><label>옮길 패널<select id="moveSource"></select></label><label>기준 패널<select id="moveTarget"></select></label><label>위치<select id="moveZone"><option value="left">왼쪽</option><option value="right">오른쪽</option><option value="top">위쪽</option><option value="bottom">아래쪽</option><option value="center">자리 바꾸기</option></select></label><button id="moveApply">이동</button></div></details></div><div class="workspace"><aside class="sessionlist" id="sessionlist"></aside><div class="canvas-scroll"><div class="canvas" id="canvas"></div></div></div></main>
<section class="compare" id="compare" hidden aria-label="테마 비교"></section><p class="help">실제 테마의 색상값과 배치 로직을 사용한 미리보기입니다. 로그는 가상 데이터이며, 실제 에이전트를 실행하지 않습니다. 테마를 바꿔도 세션 배치는 유지됩니다.</p><span id="announcement" class="sr-only" aria-live="polite"></span>
<script>
/* DOCK_MODEL */
const palettes=/* PALETTES */;
const labConfig=/* LAB_CONFIG */;
const $=s=>document.querySelector(s), escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zones={left:'왼쪽으로 분할',right:'오른쪽으로 분할',top:'위로 분할',bottom:'아래로 분할',center:'자리 바꾸기'};
const agents=[
 {id:'pane-1',role:'M',title:'Main Agent',task:'검증 범위와 전체 진행 관리',status:'범위 확인',content:`<div class="entry"><div class="entryhead"><span class="marker">YOU</span> 검증 요청 <time>00:31:08</time></div><p>승인된 내부 서비스의 접근 제어를 확인해 주세요. 검증 결과와 근거를 세션별로 남겨 주세요.</p></div><div class="entry"><div class="entryhead"><span class="marker">MAIN</span> 작업 조율 <time>00:31:10</time></div><p>대상을 세 영역으로 나눴습니다. 각 에이전트는 동일한 권한 범위에서 독립적으로 검증합니다.</p><details class="thinking"><summary>조사 방향 검토 · 생각 포함</summary><p>인증 흐름 → 권한 경계 → 결과 교차 확인</p></details><p>진행 상황과 확인된 근거를 여기서 모아 보여드리겠습니다.</p></div>`},
 {id:'pane-2',role:'P',title:'Planner',task:'조사 경로 분배 및 결과 검토',status:'진행 중',content:`<div class="entry"><div class="entryhead"><span class="marker">PLANNER</span> 조사 계획 <time>00:31:12</time></div><p>서로 다른 검증 목표를 병렬로 배정합니다. 먼저 읽기 요청으로 동작을 관찰합니다.</p><details class="tool" open><summary><span class="mono">create_intents</span> · 3개 작업 배정</summary><div class="result mono">#41  인증 상태와 세션 경계\n#42  역할별 접근 결과 비교\n#43  보안 응답 헤더 확인\n\n<span>✓ 3 workers assigned</span></div></details><p>새로운 근거가 들어오면 다음 경로를 결정합니다.</p></div>`},
 {id:'pane-3',role:'W1',title:'인증 상태와 세션 경계',task:'Worker #41 · 읽기 요청 검증',status:'근거 수집',content:`<div class="entry"><div class="entryhead"><span class="marker">WORKER #41</span> 조사 <time>00:31:16</time></div><p>로그인 전후 응답을 비교합니다. 승인된 테스트 계정의 세션 경계를 확인하고 있습니다.</p><details class="tool" open><summary><span class="mono">WebFetch</span> · 응답 확인</summary><div class="result mono">GET https://portal.example.test/profile\n\nHTTP/2 <span>200 OK</span>\ncontent-type: application/json\ncache-control: no-store\n\n<span>✓ Response recorded · 186 ms</span></div></details><div class="finding"><div class="severity">REVIEW · 검토 필요</div><strong>인증 상태에 따른 응답 차이 확인</strong><p>관찰한 결과를 기록했습니다. 취약점으로 확정하기 전 추가 검증이 필요합니다.</p><span class="mono muted">Evidence E-014 · 2 observations</span></div></div>`},
 {id:'pane-4',role:'W2',title:'역할별 접근 결과 비교',task:'Worker #42 · 권한 경계',status:'비교 중',content:`<div class="entry"><div class="entryhead"><span class="marker">WORKER #42</span> 교차 확인 <time>00:31:18</time></div><p>서로 다른 테스트 역할의 응답을 비교합니다. 요청 대상과 조건은 동일하게 유지합니다.</p><details class="tool" open><summary><span class="mono">compare_responses</span></summary><div class="result mono">viewer    → 403 Forbidden\noperator  → <span>200 OK</span>\n\n<span>✓ Expected role boundary observed</span></div></details><p>다음 읽기 경로에서도 같은 경계가 유지되는지 확인합니다.</p></div>`},
 {id:'pane-5',role:'W3',title:'보안 응답 헤더 확인',task:'Worker #43 · 구성 검토',status:'검토 완료',content:`<div class="entry"><div class="entryhead"><span class="marker">WORKER #43</span> 관찰 결과 <time>00:31:20</time></div><p>응답 헤더를 확인하고 근거를 저장했습니다.</p><details class="tool" open><summary><span class="mono">record_evidence</span></summary><div class="result mono">content-security-policy: present\nx-content-type-options: nosniff\nstrict-transport-security: present\n\n<span>✓ Evidence E-018 saved</span></div></details><p>다른 에이전트가 결과를 재사용할 수 있도록 Planner에 전달합니다.</p></div>`},
 {id:'pane-6',role:'W4',title:'수집 근거 교차 검증',task:'Worker #44 · 재현 조건 검토',status:'검토 중',content:`<div class="entry"><div class="entryhead"><span class="marker">WORKER #44</span> 근거 검토 <time>00:31:24</time></div><p>수집된 응답과 관찰 조건을 대조합니다. 결과가 충분하지 않은 항목은 검토 상태로 유지합니다.</p><details class="thinking"><summary>수집 근거 검토 · 생각 포함</summary><p>반복 가능성 · 계정 역할 · 응답 시각</p></details><details class="tool" open><summary><span class="mono">list_facts</span></summary><div class="result mono">E-014  authentication boundary\nE-018  response headers\n\n<span>✓ 2 evidence groups linked</span></div></details></div>`}
];

function luminance(h){return h.match(/\w\w/g).map(c=>parseInt(c,16)/255).map(c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4).reduce((s,c,i)=>s+c*[.2126,.7152,.0722][i],0)}
function contrast(a,b){const x=luminance(a.slice(1)),y=luminance(b.slice(1));return ((Math.max(x,y)+.05)/(Math.min(x,y)+.05)).toFixed(1)}
function applyTheme(id,newMode){preset=id;mode=newMode;if(id==='redcourage'){document.title='ARTEX · redcourage-'+mode;}document.documentElement.dataset.themePreset=id;document.documentElement.classList.toggle('dark',mode==='dark');$('#mode').value=mode;document.querySelectorAll('.choice').forEach(b=>{const v=palettes.find(p=>p.id===b.dataset.theme)[mode];if(b.dataset.theme==='redcourage')b.querySelector('strong').textContent='redcourage-'+mode;b.querySelectorAll('.swatches i').forEach((el,i)=>el.style.background=[v.background,v.primary,v.foreground][i])});document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===id));const p=palettes.find(p=>p.id===id),v=p[mode];$('#recommend').textContent=`본문 대비 ${contrast(v.foreground,v.card)}:1 · 보조 글자 ${contrast(v.mutedText,v.card)}:1`;}
$('#choices').innerHTML=palettes.map(p=>`<button class="choice" data-theme="${p.id}" aria-pressed="false"><span class="swatches"><i style="background:${p[p.mode].background}"></i><i style="background:${p[p.mode].primary}"></i><i style="background:${p[p.mode].foreground}"></i></span><span><strong>${p.label}</strong><small>${p.description}</small></span></button>`).join('');
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const p=palettes.find(p=>p.id===b.dataset.theme);applyTheme(p.id,mode)});
$('#mode').onchange=e=>applyTheme(preset,e.target.value);
$('#fontSize').onchange=e=>document.documentElement.style.setProperty('--reading',e.target.value+'px');document.documentElement.style.setProperty('--reading','16px');
const statusIcon=(kind)=>kind==='waiting'?'<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>':kind==='done'?'<svg class="state-icon done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>':'<svg class="state-icon spinning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>';
$('#sessionlist').innerHTML='<div class="list-title"><span>세션</span><span class="status"><i></i>실시간</span></div><div class="list-tokens">전체 토큰 · ↑ 24.1k · ↓ 6.8k</div>'+agents.map((a,i)=>{const kind=i===5?'waiting':i===4?'done':'running';return `${i===0?'<div class="group-heading">Main Agent</div>':i===1?'<div class="group-heading">Planner</div>':i===2?'<div class="group-heading">Workers</div>':''}<button class="session" data-select="${a.id}" title="${a.title}">${statusIcon(kind)}${i>=2?`<span class="intent-id">#${39+i}</span>`:''}<strong>${i===0?'Main #1':a.title}</strong>${kind==='running'?'<span class="live-badge"><i></i>실시간</span>':`<span class="row-state">${kind==='done'?'완료':'대기'}</span>`}</button>`}).join('');
document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{if(!dockIds(tree).includes(b.dataset.select)){setLayout(6,3)}selected=b.dataset.select;updateGeometry()});
function paneHtml(a){return `<div class="pane-inner"><div class="panehead"><button class="grip" aria-label="${a.title} 패널 이동" title="끌어서 이동">⠿</button><span class="panetitle">${a.title}</span><span class="pinen">↗</span></div><div class="panemeta"><span>${a.task}</span><span class="status"><i></i>${a.status}</span></div><div class="transcript">${a.content}</div><div class="foot"><span>● 연결됨</span><span class="elapsed">${statusIcon('waiting')}<span class="mono" ${a.id==='pane-5'||a.id==='pane-6'?'':`data-elapsed="${a.id}"`}>${a.id==='pane-6'?'대기':'00:42'}</span></span></div></div>`}
function renderPanes(){const canvas=$('#canvas');canvas.innerHTML='';for(const a of agents.slice(0,count)){const p=document.createElement('section');p.className='pane';p.dataset.pane=a.id;p.setAttribute('aria-label',a.title);p.innerHTML=paneHtml(a);p.onpointerdown=()=>{selected=a.id;updateSelection()};p.onfocusin=()=>{selected=a.id;updateSelection()};p.querySelector('.grip').onpointerdown=e=>startDrag(e,a.id);canvas.append(p)}const opts=agents.slice(0,count).map(a=>`<option value="${a.id}">${a.title}</option>`).join('');$('#moveSource').innerHTML=opts;$('#moveTarget').innerHTML=opts;$('#moveTarget').selectedIndex=count>1?1:0;updateGeometry()}
function updateSelection(){document.querySelectorAll('[data-pane]').forEach(p=>p.classList.toggle('selected',p.dataset.pane===selected));document.querySelectorAll('[data-select]').forEach(p=>p.classList.toggle('active',p.dataset.select===selected))}
function updateGeometry(preview=tree,moving=null){const g=dockGeometry(preview),base=dockGeometry(tree),min=dockMinimum(tree),canvas=$('#canvas');canvas.style.minWidth=min.width+'px';canvas.style.minHeight=min.height+'px';for(const p of canvas.querySelectorAll('[data-pane]'))Object.assign(p.style,rectStyle(moving===p.dataset.pane?base.panes[p.dataset.pane]:g.panes[p.dataset.pane]));canvas.querySelectorAll('.handle').forEach(h=>h.remove());for(const h of moving?[]:g.handles){const el=document.createElement('div'),r=h.rect;el.className='handle';el.tabIndex=0;el.setAttribute('role','separator');el.setAttribute('aria-label','패널 크기 조절');el.setAttribute('aria-orientation',h.axis==='x'?'vertical':'horizontal');el.setAttribute('aria-valuemin','20');el.setAttribute('aria-valuemax','80');el.setAttribute('aria-valuenow',Math.round(h.ratio*100));Object.assign(el.style,h.axis==='x'?{left:`calc(${(r.x+r.width*h.ratio)*100}% - 4px)`,top:`${r.y*100}%`,width:'8px',height:`${r.height*100}%`,cursor:'col-resize'}:{left:`${r.x*100}%`,top:`calc(${(r.y+r.height*h.ratio)*100}% - 4px)`,height:'8px',width:`${r.width*100}%`,cursor:'row-resize'});el.onpointerdown=e=>startResize(e,h);el.ondblclick=()=>{tree=dockResize(tree,h.id,.5);updateGeometry()};el.onkeydown=e=>{const dec=h.axis==='x'?'ArrowLeft':'ArrowUp',inc=h.axis==='x'?'ArrowRight':'ArrowDown';if(e.key===dec||e.key===inc){e.preventDefault();tree=dockResize(tree,h.id,h.ratio+(e.key===dec?-.05:.05));updateGeometry();[...canvas.querySelectorAll('.handle')].find(x=>x.dataset.id===h.id)?.focus()}};el.dataset.id=h.id;canvas.append(el)}updateSelection()}
function gesture(e,move,finish){e.preventDefault();const id=e.pointerId;const onMove=ev=>{if(ev.pointerId===id)move(ev)};const end=cancel=>{window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancelled);window.removeEventListener('keydown',key);window.removeEventListener('blur',cancelled);window.removeEventListener('resize',cancelled);finish(cancel)};const up=ev=>{if(ev.pointerId===id){move(ev);end(false)}};const cancelled=ev=>{if(ev.type!=='pointercancel'||ev.pointerId===id)end(true)};const key=ev=>{if(ev.key==='Escape'){ev.preventDefault();end(true)}};window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancelled);window.addEventListener('keydown',key);window.addEventListener('blur',cancelled);window.addEventListener('resize',cancelled)}
function startDrag(e,id){
 if(e.button!==0)return;
 const canvas=$('#canvas'),base=tree,regions=dockGeometry(base).panes,pane=canvas.querySelector(`[data-pane="${id}"]`);
 const x=e.clientX,y=e.clientY;let drop=null,preview=base,active=false;
 const overlay=document.createElement('div');overlay.className='drop';overlay.innerHTML='<div><span></span></div>';
 gesture(e,ev=>{
  if(!active&&Math.hypot(ev.clientX-x,ev.clientY-y)<6)return;
  const first=!active;active=true;canvas.classList.add('dragging');pane.classList.add('dragging');
  pane.style.transform=`translate3d(${ev.clientX-x}px,${ev.clientY-y}px,0) scale(.98)`;
  const box=canvas.getBoundingClientRect(),next=dockDropTarget(regions,id,(ev.clientX-box.left)/box.width,(ev.clientY-box.top)/box.height);
  if(first||next?.target!==drop?.target||next?.zone!==drop?.zone){
   drop=next;preview=drop?dockMove(base,id,drop.target,drop.zone):base;updateGeometry(preview,id);
   if(drop){Object.assign(overlay.style,rectStyle(dockGeometry(preview).panes[id]));overlay.querySelector('span').textContent=zones[drop.zone];canvas.append(overlay)}else overlay.remove();
  }
 },cancel=>{
  overlay.remove();canvas.classList.remove('dragging');pane.classList.remove('dragging');pane.style.transform='translate3d(0,0,0)';
  tree=!cancel&&active&&drop?preview:base;updateGeometry();if(!cancel&&active&&drop){markCustom();$('#announcement').textContent='패널 위치를 변경했습니다'}
 });
}
function startResize(e,h){if(e.button!==0)return;$('#canvas').classList.add('resizing');const initial=tree,b=$('#canvas').getBoundingClientRect(),r=h.rect;gesture(e,ev=>{const ratio=h.axis==='x'?((ev.clientX-b.left)/b.width-r.x)/r.width:((ev.clientY-b.top)/b.height-r.y)/r.height;tree=dockResize(initial,h.id,ratio);markCustom();updateGeometry()},cancel=>{$('#canvas').classList.remove('resizing');if(cancel){tree=initial;updateGeometry()}})}
function markCustom(){document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed','false'))}
function setLayout(n,c){count=n;columns=c;if(!agents.slice(0,n).some(a=>a.id===selected))selected=null;tree=dockGrid(agents.slice(0,n).map(a=>a.id),c);document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.layout===`${n}-${c}`));renderPanes()}
$('#layouts').innerHTML=[[2,2,'2'],[3,3,'3'],[4,4,'4'],[2,1,'1×2'],[4,2,'2×2'],[6,3,'3×2']].map(([n,c,label])=>`<button data-layout="${n}-${c}" aria-pressed="${n===3}">${label}</button>`).join('');document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>setLayout(...b.dataset.layout.split('-').map(Number)));
$('#moveApply').onclick=()=>{tree=dockMove(tree,$('#moveSource').value,$('#moveTarget').value,$('#moveZone').value);markCustom();updateGeometry()};
$('#toggleList').onclick=()=>{const show=$('#sessionlist').hidden;$('#sessionlist').hidden=!show;$('#toggleList').setAttribute('aria-pressed',show)};
function renderComparison(){const root=$('#compare');root.innerHTML='';const graphite=palettes.find(p=>p.id===preset);const entries=comparisonMode==='contrast'?[{p:graphite,m:'light'},{p:graphite,m:'dark'}]:palettes.map(p=>({p,m:p.mode}));for(const {p,m} of entries){const v=p[m],card=document.createElement('article');card.className='sample';for(const [k,val] of Object.entries(paletteVars(v)))card.style.setProperty(k,val);card.innerHTML=`<header><strong>${p.id==='redcourage'?'redcourage-'+m:p.label+(comparisonMode==='contrast'?(m==='dark'?' · Dark':' · Light'):'')}</strong><span class="spacer"></span><span class="tag">${m}</span></header><div class="transcript">${agents[2].content}</div><footer><span>본문 <b class="contrast">${contrast(v.foreground,v.card)}:1</b> · 보조 <b class="contrast">${contrast(v.mutedText,v.card)}:1</b></span><button>이 화면 크게 보기</button></footer>`;card.querySelector('button').onclick=()=>{applyTheme(p.id,m);toggleCompare(false)};root.append(card)}}
function toggleCompare(value){comparing=value;$('#compare').hidden=!value;$('#app').hidden=value;$('#compareButton').setAttribute('aria-pressed',value&&comparisonMode==='all');$('#compareGraphiteButton').setAttribute('aria-pressed',value&&comparisonMode==='contrast');if(value)renderComparison()}
$('#compareButton').onclick=()=>{const next=!comparing||comparisonMode!=='all';comparisonMode='all';toggleCompare(next)};
$('#compareGraphiteButton').onclick=()=>{const next=!comparing||comparisonMode!=='contrast';comparisonMode='contrast';toggleCompare(next)};
document.addEventListener('pointerdown',e=>{if(!(e.target instanceof Element))return;if(e.target.closest('[data-pane],#sessionlist'))return;selected=null;updateSelection()},true);
function capture(on){toggleCompare(false);document.body.classList.toggle('capture',on);$('#exitCapture').hidden=!on}$('#capture').onclick=()=>capture(true);$('#exitCapture').onclick=()=>capture(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('capture'))capture(false)});
$('#play').onclick=()=>{if(ticker){clearInterval(ticker);ticker=null}else ticker=setInterval(()=>{tick++;for(const el of $('#canvas').querySelectorAll('.transcript')){const following=el.scrollHeight-el.clientHeight-el.scrollTop<60;let live=el.querySelector('.simulated');if(!live){live=document.createElement('div');live.className='entry simulated';el.append(live)}live.innerHTML=`<div class="entryhead"><span class="marker">LIVE</span> 활동 시뮬레이션 <time>+${tick*6}s</time></div><p>${['검증 근거를 정리하고 있습니다.','다른 에이전트의 관찰 결과와 비교합니다.','검증 조건을 다시 확인하고 다음 단계를 준비합니다.'][tick%3]}</p>`;if(following)el.scrollTo({top:el.scrollHeight,behavior:'smooth'})}},6000);$('#play').setAttribute('aria-pressed',!!ticker);$('#play').textContent=ticker?'Ⅱ 활동 정지':'▶ 활동 재생'};
$('#compareGraphiteButton').textContent='Light / Dark 비교';$('#compareButton').textContent=palettes.length+'개 테마 비교';$('#compareButton').hidden=palettes.length===1;$('#choices').style.gridTemplateColumns='repeat('+Math.min(palettes.length,4)+',minmax(0,1fr))';if(labConfig.presentation){document.title='ARTEX · '+palettes[0].label;}
const startedAt=Date.now();setInterval(()=>{const seconds=42+Math.floor((Date.now()-startedAt)/1000);document.querySelectorAll('[data-elapsed]').forEach(el=>{el.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')})},1000);applyTheme(preset,mode);renderPanes();comparisonMode='contrast';if(labConfig.presentation){capture(true)}else{toggleCompare(true)}
</script></body></html>
